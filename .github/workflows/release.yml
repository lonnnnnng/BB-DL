name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要发布或补传资产的版本标签，例如 v1.0.13"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test CLI
        run: go test ./cmd/bbdown ./internal/bbdown

      - name: Build release artifacts
        run: VERSION="$RELEASE_TAG" ./scripts/build-release.sh

      - name: Verify release artifacts
        run: ./scripts/verify-artifacts.sh cli dist/release/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --generate-notes
          fi

  desktop-release:
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact-glob: dist/desktop/*.zip
          - os: ubuntu-latest
            artifact-glob: dist/desktop/*.tar.gz
          - os: windows-latest
            artifact-glob: dist/desktop/*.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgl1-mesa-dev xorg-dev libxkbcommon-dev

      - name: Install Windows GUI dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            zip
            unzip

      - name: Test desktop
        if: runner.os == 'macOS'
        run: go test ./...

      - name: Test desktop
        if: runner.os == 'Linux'
        run: go test -tags webkit2_41 .

      - name: Test desktop
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: go test .

      - name: Build desktop artifact
        if: runner.os != 'Windows'
        shell: bash
        run: VERSION="$RELEASE_TAG" OUT_DIR="$PWD/dist/desktop" bash scripts/build-desktop.sh

      - name: Build desktop artifact
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: VERSION="$RELEASE_TAG" OUT_DIR="$PWD/dist/desktop" bash scripts/build-desktop.sh

      - name: Verify desktop artifact
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/verify-artifacts.sh desktop ${{ matrix.artifact-glob }}

      - name: Verify desktop artifact
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/verify-artifacts.sh desktop ${{ matrix.artifact-glob }}

      - name: Verify macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          zipfile="$(ls dist/desktop/BB-DL_*_desktop_darwin_*.zip)"
          tmpdir="$(mktemp -d)"
          unzip -q "$zipfile" -d "$tmpdir"
          app="$tmpdir/BB-DL.app"
          plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist" | grep -qx '11.0'
          otool -l "$app/Contents/MacOS/BB-DL" | grep -A4 LC_BUILD_VERSION
          otool -l "$app/Contents/MacOS/BB-DL" | grep -q 'minos 11.0'
          otool -l "$app/Contents/Resources/BB-DL-cli" | grep -A4 LC_BUILD_VERSION
          otool -l "$app/Contents/Resources/BB-DL-cli" | grep -q 'minos 11.0'

      - name: Upload desktop artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" ${{ matrix.artifact-glob }} --repo "$GITHUB_REPOSITORY" --clobber
